[binaries]
c       = 'xtensa-esp32-elf-gcc'
cpp     = 'xtensa-esp32-elf-g++'
ar      = 'xtensa-esp32-elf-ar'
strip   = 'xtensa-esp32-elf-strip'
esptool = 'esptool' # Meson can find this if it's in your PATH

[built-in options]
c_args      = ['-ffreestanding', '-fno-tree-loop-distribute-patterns']
c_link_args = ['-nostdlib', '-lgcc']

[host_machine]
system     = 'baremetal'
cpu_family = 'xtensa'
cpu        = 'esp32'
endian     = 'little'

