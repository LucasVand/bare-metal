[binaries]
c       = 'clang'
ar      = 'llvm-ar'
strip   = 'llvm-strip'
esptool = 'esptool'

[built-in options]
c_args      = ['--target=xtensa-esp-elf', '-mcpu=esp32', '-ffreestanding', '-nostdlib', '-gz=none', '-Wa,--compress-debug-sections=none']
c_link_args = ['--target=xtensa-esp-elf', '-mcpu=esp32', '-nostdlib', '-fuse-ld=lld']

[host_machine]
system = 'none'
cpu_family = 'riscv32'
cpu = 'rv32imac'
endian = 'little'
