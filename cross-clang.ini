[binaries]
c       = 'clang'
ar      = 'llvm-ar'
strip   = 'llvm-strip'
esptool = 'esptool'

[built-in options]
# esp-clang's multilib matching requires the versioned extension names
c_args      = ['--target=riscv32-esp-elf', '-march=rv32i2p1_m2p0_a2p1_c2p0_zicsr2p0_zifencei2p0', '-mabi=ilp32', '-ffreestanding', '-nostdlib', '-gz=none', '-Wa,--compress-debug-sections=none']
c_link_args = ['--target=riscv32-esp-elf', '-march=rv32i2p1_m2p0_a2p1_c2p0_zicsr2p0_zifencei2p0', '-mabi=ilp32', '-nostdlib', '-fuse-ld=lld']

[host_machine]
system = 'none'
cpu_family = 'riscv32'
cpu = 'rv32imac'
endian = 'little'
